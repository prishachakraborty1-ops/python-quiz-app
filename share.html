{% extends "base.html" %}
{% block content %}
  <h2>Quiz Ready! 🎉</h2>
  <p>Hey <strong>{{ quiz.creator_name }}</strong>, share this link with your friends to see who knows you best:</p>
  
  <div class="share-box" id="quizLink">{{ quiz_url }}</div>
  
  <button type="button" onclick="copyLink()" class="btn">Copy Link</button>
  <a href="{{ url_for('scoreboard', quiz_id=quiz.quiz_id) }}" class="btn btn-secondary">View Scoreboard</a>

  <script>
    function copyLink() {
      const link = document.getElementById('quizLink').innerText;
      navigator.clipboard.writeText(link);
      alert('Link copied to clipboard!');
    }
  </script>
{% endblock %}
