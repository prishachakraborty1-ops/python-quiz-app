<form method="POST">
  <div class="form-group">
    <label>Your Name</label>
    <input type="text" name="creator_name" required>
  </div>

  <p>Write up to 10 questions about yourself (minimum 3 required)!</p>

  {% for i in range(1, 11) %}
    <div class="form-group" style="background: #f1f3f5; padding: 15px; border-radius: 8px;">
      <label>Custom Question {{ i }} {% if i > 3 %}(Optional){% endif %}</label>
      <input type="text" name="q{{ i }}_text" placeholder="e.g., What is my favorite movie?" {% if i <= 3 %}required{% endif %}>
      
      <label style="margin-top: 10px;">The Correct Answer</label>
      <input type="text" name="q{{ i }}_ans" placeholder="e.g., Inception" {% if i <= 3 %}required{% endif %}>
    </div>
  {% endfor %}

  <button type="submit" class="btn">Create Quiz</button>
</form>
