{% extends "base.html" %}
{% block content %}
  <h2>Create Your Quiz 📝</h2>
  <form method="POST">
    <div class="form-group">
      <label for="creator_name">Your Name</label>
      <input type="text" id="creator_name" name="creator_name" placeholder="e.g., Alex" required>
    </div>

    {% for q in questions %}
      <div class="form-group">
        <label>{{ loop.index }}. {{ q.question }}</label>
        <div class="options-grid">
          {% for opt in q.options %}
            <label class="option-btn">
              <input type="radio" name="q_{{ q.id }}" value="{{ opt }}" required>
              <span>{{ opt }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}

    <button type="submit" class="btn">Generate Share Link</button>
  </form>
{% endblock %}
