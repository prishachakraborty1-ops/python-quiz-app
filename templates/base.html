<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MateQuiz - Expose Your Friends</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --primary: #ff4757;
      --secondary: #1e90ff;
      --text: #2f3542;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #ffb199);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text);
      margin: 0;
      padding: 40px 20px 80px 20px; /* নিচের ব্যাজটির জন্য জায়গা রাখা হলো */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body::before {
      content: "🤪 😂 🍕 💀 🤡 👽 🦄 🔥 💅 👻 🤡 💀 🤪 🍕 👽 🤪 😂 🍕 💀 🤡 👽 🦄 🔥 💅 👻";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      font-size: 4rem;
      line-height: 1.8;
      opacity: 0.15;
      z-index: -1;
      pointer-events: none;
      word-wrap: break-word;
      text-align: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      border: 5px dashed var(--primary);
    }

    h1, h2 { text-align: center; color: var(--primary); text-shadow: 2px 2px 0px #ffeaa7; font-size: 2.2rem; margin-top: 0; }
    p { line-height: 1.6; font-size: 1.1rem; text-align: center; }
    
    .funny-img { max-width: 100%; height: auto; border-radius: 16px; margin: 15px auto; display: block; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #576574; }
    input[type="text"] { width: 100%; padding: 14px; border: 3px solid #dfe6e9; border-radius: 12px; font-size: 16px; font-family: 'Fredoka', sans-serif; transition: all 0.3s; }
    input[type="text"]:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 4px rgba(30, 144, 255, 0.2); }
    
    .btn { display: block; width: 100%; padding: 16px; background: linear-gradient(45deg, var(--primary), #ff7f50); color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; font-family: inherit; cursor: pointer; text-align: center; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4); }
    
    .flash { padding: 15px; background-color: #ffcccc; color: #d63031; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #d63031; font-weight: bold; }
    
    .scoreboard-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .scoreboard-table th, .scoreboard-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }

    /* =========================================
       আপনার নিজস্ব ক্রিয়েটর ব্যাজ (Creator Badge)
       ========================================= */
    .creator-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 600;
      color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 2px dashed var(--secondary);
      z-index: 1000;
      font-size: 1rem;
      transition: all 0.3s ease;
      cursor: default;
    }
    
    .creator-badge strong {
      color: var(--secondary);
    }

    .creator-badge:hover {
      transform: scale(1.05) translateY(-5px);
      background: var(--primary);
      color: white;
      border-color: white;
    }
    
    .creator-badge:hover strong {
      color: #ffeaa7;
    }

    /* মোবাইলের জন্য রেসপন্সিভ ডিজাইন */
    @media (max-width: 600px) {
      body { padding: 15px 10px 70px 10px; }
      .container { padding: 25px 15px; border-width: 3px; border-radius: 18px; }
      h1, h2 { font-size: 1.7rem; }
      .creator-badge {
        bottom: 15px;
        right: 50%;
        transform: translateX(50%);
        width: max-content;
        font-size: 0.85rem;
        padding: 10px 20px;
      }
      .creator-badge:hover {
        transform: translateX(50%) scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}
  </div>

  <!-- আপনার পার্সোনাল সিগনেচার -->
  <div class="creator-badge">
    Developed with 💻 & 💖 by <strong>Prisha Chakraborty</strong>
  </div>
</body>
</html>
