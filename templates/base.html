<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MateQuiz - Expose Your Friends</title>
  <!-- Fun, rounded font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #ff4757;
      --secondary: #1e90ff;
      --text: #2f3542;
    }

    /* 1. ANIMATED COLOR SHIFTING BACKGROUND */
    body {
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #ffb199);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 2. FLOATING EMOJI BACKGROUND LAYER */
    body::before {
      content: "🤪 😂 🍕 💀 🤡 👽 🦄 🔥 💅 👻 🤡 💀 🤪 🍕 👽 🤪 😂 🍕 💀 🤡 👽 🦄 🔥 💅 👻";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      font-size: 4rem;
      line-height: 1.8;
      opacity: 0.15; /* Keeps it faint so it doesn't ruin readability */
      z-index: -1;
      pointer-events: none;
      word-wrap: break-word;
      text-align: center;
    }

    /* 3. GLASS CONTAINER WITH FUN BORDER */
    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      border: 5px dashed var(--primary);
    }

    h1, h2 { text-align: center; color: var(--primary); text-shadow: 2px 2px 0px #ffeaa7; font-size: 2.2rem; margin-top: 0; }
    p { line-height: 1.6; font-size: 1.1rem; text-align: center; }
    
    .funny-img { max-width: 100%; height: auto; border-radius: 16px; margin: 15px auto; display: block; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    
    .form-group { margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #576574; }
    input[type="text"] { width: 100%; padding: 14px; border: 3px solid #dfe6e9; border-radius: 12px; font-size: 16px; font-family: 'Fredoka', sans-serif; box-sizing: border-box; transition: all 0.3s; }
    input[type="text"]:focus { border-color: var(--secondary); outline: none; box-shadow: 0 0 0 4px rgba(30, 144, 255, 0.2); }
    
    .btn { display: block; width: 100%; padding: 16px; background: linear-gradient(45deg, var(--primary), #ff7f50); color: white; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; font-family: inherit; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-5px) scale(1.03); box-shadow: 0 12px 20px rgba(255, 71, 87, 0.4); }
    
    .flash { padding: 15px; background-color: #ffcccc; color: #d63031; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #d63031; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}
  </div>
</body>
</html>
