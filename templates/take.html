{% extends "base.html" %}
{% block content %}
  <h2>How well do you know {{ quiz.creator_name }}? 🧐</h2>
  <form method="POST">
    <div class="form-group">
      <label for="friend_name">Your Name</label>
      <input type="text" id="friend_name" name="friend_name" placeholder="Enter your name" required>
    </div>

    {% for q in questions %}
      <div class="form-group">
        <label>{{ loop.index }}. {{ q.question }}</label>
        <div class="options-grid">
          {% for opt in q.options %}
            <label class="option-btn">
              <input type="radio" name="q_{{ q.id }}" value="{{ opt }}" required>
              <span>{{ opt }}</span>
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}

    <button type="submit" class="btn">Submit Answers</button>
  </form>
{% endblock %}
