{% extends "base.html" %}
{% block content %}
  <style>
    .mcq-option {
      display: block;
      background: #f8f9fa;
      padding: 15px;
      margin: 10px 0;
      border-radius: 12px;
      border: 2px solid #dfe6e9;
      cursor: pointer;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.2s ease;
    }
    
    .mcq-option:hover {
      background: #e7f5ff;
      border-color: var(--secondary);
      transform: translateX(5px);
    }
    
    .mcq-option input[type="radio"] {
      margin-right: 12px;
      transform: scale(1.3);
      cursor: pointer;
    }

    .question-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      border: 2px solid #dfe6e9;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .question-label {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--primary);
      display: block;
    }

    .text-center {
      text-align: center;
    }

    .warning-text {
      text-align: center;
      font-weight: bold;
      color: #ff4757;
    }

    .submit-btn {
      margin-top: 20px;
    }
  </style>

  <h2>Do you REALLY know {{ quiz.creator_name }}? 🧐</h2>
  
  <div class="text-center">
    <img src="https://media.giphy.com/media/3o7TKSjRrfIPjeiVyM/giphy.gif" alt="Staring GIF" class="funny-img">
  </div>
  
  <p class="warning-text">Don't mess this up, or the friendship is over. 💅</p>

  <form method="POST">
    <div class="form-group">
      <label for="friend_name">Enter your name (if you dare):</label>
      <input type="text" id="friend_name" name="friend_name" placeholder="e.g., Soon-to-be ex-bestie" required>
    </div>

    {% for item in quiz_data %}
      <div class="form-group question-card">
        <label class="question-label">🤔 {{ loop.index }}. {{ item.question }}</label>
        
        {% for opt in item.options %}
          <label class="mcq-option">
            <input type="radio" name="ans_{{ loop.parent.loop.index0 }}" value="{{ opt }}" required>
            {{ opt }}
          </label>
        {% endfor %}

      </div>
    {% endfor %}

    <button type="submit" class="btn submit-btn">Submit Answers & Pray 🙏</button>
  </form>
{% endblock %}
