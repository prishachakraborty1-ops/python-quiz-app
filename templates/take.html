<form method="POST">
  <div class="form-group">
    <label for="friend_name">Your Name</label>
    <input type="text" id="friend_name" name="friend_name" placeholder="Enter your name" required>
  </div>

  {% for item in quiz_data %}
    <div class="form-group" style="background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
      <label>{{ loop.index }}. {{ item.question }}</label>
      <input type="text" name="ans_{{ loop.index0 }}" placeholder="Type your guess here..." required>
    </div>
  {% endfor %}

  <button type="submit" class="btn">Submit Answers</button>
</form>
